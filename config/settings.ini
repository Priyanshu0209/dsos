[DSOS]
# Configuration file for Autonomous Drone Swarm Operating System

# General settings
swarm_size = 3
simulation_mode = true

# Startup Modes (Set backend_type to one of these)
# - simulation : Built-in minimal simulator
# - airsim : Microsoft AirSim simulator
# - px4_sitl : PX4 SITL (using MAVSDK)
# - gazebo : Gazebo simulator (using MAVSDK)
# - mavsdk : Direct MAVSDK connection
# - real_drone : Direct Pixhawk hardware connection
backend_type = simulation

# Auto-start Configuration
auto_start_simulation = true
launch_qgc = true
px4_path = /home/priyanshu/PX4/PX4-Autopilot
gazebo_path = gz
qgc_path = /home/priyanshu/Downloads/QGroundControl-x86_64.AppImage

# Backend configurations
airsim_host = localhost
airsim_port = 41451
px4_host = localhost
px4_port = 4560
gazebo_host = localhost
gazebo_port = 11345
mavsdk_address = udp://:14540
real_drone_connection = /dev/ttyUSB0

update_rate_hz = 50

# Communication settings
heartbeat_interval_sec = 1.0
message_timeout_sec = 5.0
mesh_network_port = 9000
broadcast_prefix = "DSOS_"

# Safety settings
max_velocity_mps = 5.0
max_acceleration_mps2 = 2.0
min_safe_distance_m = 2.0
obstacle_threshold_m = 1.0

# Battery settings
battery_capacity_mah = 5000
low_battery_threshold_percent = 20
critical_battery_threshold_percent = 5

# Mission settings
default_mission_altitude_m = 10.0
waypoint_acceptance_radius_m = 1.0

# Logging
log_level = INFO
log_file = logs/dsos.log

# Telemetry
telemetry_update_rate_hz = 10
telemetry_history_size = 1000

# AI/Agent settings
decision_update_rate_hz = 10
behavior_tree_tick_rate_hz = 5

# Formation settings
default_formation = V_FORMATION
formation_update_rate_hz = 5